# SonarCloud analysis data (CICD-B-086). Organization is committed here; project key is in the caller workflow.
sonar.organization=adamantinoo
sonar.projectName=neocom-back
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/src/generated/**,**/*.test-util.ts
sonar.coverage.exclusions=**/src/generated/**,**/*.module.ts,**/main.ts,**/*.test-util.ts
# Thin Redis cache adapters share connect/lifecycle shape; not copy-paste debt.
sonar.cpd.exclusions=**/redis-*-cache.adapter.ts
# Vitest coverage-v8 writes coverage/lcov.info (see vitest.config.ts reportsDirectory).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

