openapi: 3.0.3
info:
  title: NEOCOM Pilot Adapter API
  version: 0.1.0
  description: |
    ### Pilot inbound adapter (`V1PilotController`)

    |||
    |------------------|------------------------------------------|
    |**System:**|back|
    |**Adapter:**|pilot|
    |**Controller:**|`src/infrastructure/adapters/inbound/pilot/v1-pilot.controller.ts`|
    ---

    `GET /v1/pilots/{pilotId}` returns `PublicPilotV1` when anonymous, or `PilotV2` when
    logged in (non-empty `Authorization` header — value not validated as a token).

    Private fields are **omitted** when the caller is not logged in:
    `totalSkillpoints`, `walletBalance`, `currentShipName`, `currentShipTypeName`, `lastKnownLocation`.

    **Error body:** `NeocomError` via ExceptionCatalog (**400**, **404**, **500**).

    ## Changelog

    * `0.1.0` — Pilot get; NeocomError outcomes; domain schema names (`PublicPilotV1` / `PilotV2`).
paths:
  /v1/pilots/{pilotId}:
    get:
      operationId: getPilot
      summary: Pilot
      description: |
        JSON view of the Pilot model for `pilotId` at `GET /v1/pilots/{pilotId}`.

        A non-empty `Authorization` header means the caller is logged in.
        The header value is not validated here.

        **Response semantics:**
        * **200** — `PilotV2`.
        * **400** — `pilotId` is not an integer.
        * **404** — no pilot exists for `pilotId`.
        * **500** — the pilot source is not available.
      parameters:
        - name: pilotId
          in: path
          required: true
          description: >
            Pilot identifier.
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: |
            `PublicPilotV1` when anonymous; `PilotV2` when logged in (`neocom-domain`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PublicPilotV1"
                  - $ref: "#/components/schemas/PilotV2"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
components:
  schemas:
    PilotV2:
      allOf:
        - $ref: "#/components/schemas/PublicPilotV1"
        - type: object
          description: |
            Authenticated pilot (`neocom-domain` PilotV2). Includes private fields.
          properties:
            jsonClass:
              type: string
              enum: [PilotV2]
            totalSkillpoints:
              type: number
            walletBalance:
              type: number
            currentShipName:
              type: string
            currentShipTypeName:
              type: string
            lastKnownLocation:
              $ref: "#/components/schemas/SpaceLocationV1"
            alliance:
              $ref: "#/components/schemas/PilotAllianceSummary"
    PublicCorporationSummary:
      type: object
      description: |
        Public corporation summary on a pilot (`neocom-domain`).
      properties:
        corporationId:
          type: number
        name:
          type: string
    PilotAllianceSummary:
      type: object
      description: |
        Alliance summary on authenticated pilot (`neocom-domain`).
      properties:
        allianceId:
          type: number
        name:
          type: string
    PilotNameSummary:
      type: object
      description: |
        Named race / ancestry / bloodline summary (`neocom-domain`).
      properties:
        name:
          type: string
          required: true
    PublicPilotV1:
      type: object
      description: |
        Public-only pilot (`neocom-domain`). Returned when the caller is not logged in.
      required:
        - pilotId
        - jsonClass
      properties:
        jsonClass:
          type: string
          enum: [PublicPilotV1]
        pilotId:
          type: number
        name:
          type: string
        corporation:
          $ref: "#/components/schemas/PublicCorporationSummary"
        birthday:
          type: string
        description:
          type: string
        gender:
          type: string
        securityStatus:
          type: number
        url4Icon:
          type: string
        raceData:
          $ref: "#/components/schemas/PilotNameSummary"
        ancestryData:
          $ref: "#/components/schemas/PilotNameSummary"
        bloodlineData:
          $ref: "#/components/schemas/PilotNameSummary"
    SpaceLocationV1:
      type: object
      description: |
        Space location lookup (`neocom-domain` SpaceLocationV1).

    ErrorsInner:
      description: |
        Single validation or backend error entry.
      type: object
      required:
        - code
        - description
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        description:
          type: string
          example: "No pilot exists for this identifier."
        field:
          type: string
          example: "pilotId"
        container:
          type: string
          example: "path"
        value:
          type: string
          example: "93813310"

    NeocomError:
      description: |
        Error response with one or more `errors` entries. `NeocomBackendError` serializes to this shape.
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorsInner"
        traceId:
          type: string
          description: |
            Optional correlation trace identifier when the upper layer has one.
      example:
        errors:
          - code: "NOT_FOUND"
            description: "No pilot exists for this identifier."
            field: "pilotId"
            container: "path"
            value: "93813310"

  responses:
    BadRequestResponse:
      description: |
        `pilotId` is missing or not an integer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NeocomError"
          examples:
            InvalidPilotId:
              summary: pilotId is not an integer
              value:
                errors:
                  - code: "INVALID_REQUEST"
                    description: "pilotId must be an integer."
                    field: "pilotId"
                    container: "path"
                    value: "not-a-number"
    NotFoundResponse:
      description: |
        No pilot exists for `pilotId`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NeocomError"
          examples:
            PilotNotFound:
              summary: Unknown pilot identifier
              value:
                errors:
                  - code: "NOT_FOUND"
                    description: "No pilot exists for this identifier."
                    field: "pilotId"
                    container: "path"
                    value: "93813310"
    InternalServerErrorResponse:
      description: |
        The pilot source is not available, or another unexpected failure occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NeocomError"
          examples:
            PilotSourceUnavailable:
              summary: Pilot source is not available
              value:
                errors:
                  - code: "INTERNAL_SERVER_ERROR"
                    description: "The pilot source is not available."
            UnexpectedInternalServerError:
              value:
                errors:
                  - code: "INTERNAL_SERVER_ERROR"
                    description: "Unexpected error produced during the request processing."
