openapi: 3.1.0
info:
  title: Payment Gateway Transaction Capture Adapter API - Version 0.2.0
  version: 0.2.0
  description: |
    ### Payment Gateway Transaction Capture Adapter API

    |||
    |------------------|------------------------------------------|
    |**Domain:**|Pagos Banca Electronica (pagos-banca-electronica)|
    |**Subdomain:**|Next Hub (nexthub)|
    |**Service:**|Payment Gateway Transaction Capture Adapter|
    |**Application:**|payment-gateway-transaction-adapter (`GTA-001`)|
    ---

    Ingestion-only HTTP API for **PR278 Next Hub**. Payment gateways submit a
    `GatewayPaymentRequestDto` JSON envelope via **mTLS**. `GTA-001` validates identity,
    encrypts the `MSG` field (AES-256-GCM + AWS KMS envelope encryption), publishes an
    `EncryptedRawPaymentGatewayMessage` JSON message to Kafka `raw.v1`, and returns **HTTP 202**
    only after a durable broker ACK.

    **Goals (v0.2):**
    * **Must:** **`POST /v1/gateway/payments`** — accept `GatewayPaymentRequestDto`; return **202** after Kafka durable ACK.
    * **Must:** Accept `Content-Type: application/json` **or** `text/plain` carrying the same JSON object body.
    * **Must not:** interpret or log functional `MSG` content beyond structural validation.

    **General behaviour:**
    * Write-only ingestion endpoint; no read/query operations.
    * Authentication is **mutual TLS** (client certificate mandatory). OAuth/JWT is **not** used on this pathway.
    * Success response body includes adapter-generated `messageId` and `correlationId` for gateway-side traceability.
    * Error bodies use Cecabank **`StandardError`** (`errors[]` with `ErrorsInner` entries).
    * Documented HTTP error statuses (no Apigee in front): **400**, **415**, **500**
      (additional auth/client statuses may be added when requirements are closed).

    ## Operations (v0.2)

    | Priority | Method | Path | Summary |
    |----------|--------|------|---------|
    | **Must** | `POST` | `/v1/gateway/payments` | Ingest `GatewayPaymentRequestDto` |

    ## Security

    **Mutual TLS (mTLS)** — payment gateway presents a client certificate; `GTA-001` extracts `gatewayId` from the
    certificate and validates it against the authorised gateway list before processing the payload.

    Certificate rotation: both current and successor trust anchors may be configured during overlap
    (`Q-SEC-003` — see `05.CODE-DESIGN/01.MTLS-CERTIFICATE-ROTATION.md`).

    ## Kafka event contract

    HTTP ingestion is documented here (OpenAPI). The Kafka output contract is documented in
    `tools/asynchapi/gateway-adapter-events-v0.1.0.yaml` (JSON — `Q-KAFKA-006`).

    ## Change log

    * `0.2.0` — Request body is `GatewayPaymentRequestDto` JSON (`CSBADQ`, `CSBEMI`, `IDTRANS`, `MSG`).
      `CSBADQ` / `CSBEMI` are **string** fields (`^[0-9]{1,4}$`). Supported media types:
      `application/json` and `text/plain` (same JSON object bytes). Missing or unsupported
      `Content-Type` → **HTTP 415** (`INVALID_CONTENT_TYPE`). DTO field validation failures remain
      **HTTP 400**. Aligns with [01.GATEWAY-MODELS.md](../doc/04.REQUIREMENTS/01.MODELS/01.GATEWAY-MODELS.md).
    * `0.1.0` — Initial ingestion contract: **`POST /v1/gateway/payments`**; mTLS security; opaque
      free-text body draft; **202** acceptance semantics; adapter error model.

