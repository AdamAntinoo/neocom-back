# Flyway config for neocom-back schema (repo-owned DB state).
# Credentials match tools/docker/docker-compose.yml and .env.async.
# Prefer: npm run db:migrate (runs Flyway via Docker). Do not rely on TypeORM synchronize in shared envs.

flyway.url=jdbc:postgresql://host.docker.internal:6003/neocom_async
flyway.user=neocom
flyway.password=neocom
flyway.locations=filesystem:/flyway/sql
flyway.baselineOnMigrate=true
flyway.validateOnMigrate=true
