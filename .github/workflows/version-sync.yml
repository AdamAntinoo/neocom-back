# Disabled: do not auto-sync versions on push (kept for optional manual runs).
# Local/pre-commit still uses scripts/sync-version.mjs via package prepare hooks as needed.
name: Version sync

on:
  workflow_dispatch:

concurrency:
  group: version-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    uses: AdamAntinoo/neocom-meta/.github/workflows/version-sync.yml@feature/cicd
    with:
      node-version: 24.21.0
    secrets: inherit
