# Continuous deployment. package.json stays 0.0.0 for CI cache; version:sync writes
# MajorMinorPatch into banner/env files only. On main, each commit increments minor.
next-version: 0.0.1
assembly-informational-format: '{FullSemVer}'
mode: ContinuousDeployment
branches:
  main:
    regex: ^main$
    mode: ContinuousDeployment
    increment: Minor
    prevent-increment-of-merged-branch-version: false
    track-merge-target: false
  develop:
    regex: ^develop$
    mode: ContinuousDeployment
    increment: Patch
    prevent-increment-of-merged-branch-version: false
    track-merge-target: true
  release:
    regex: ^release?[/-]
    mode: ContinuousDeployment
    tag: ''
    increment: None
    prevent-increment-of-merged-branch-version: true
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: true
  pull-request:
    mode: ContinuousDelivery
    tag: PullRequest
    increment: Patch
    prevent-increment-of-merged-branch-version: false
    tag-number-pattern: '[/-](?<number>\d+)[-/]'
    track-merge-target: false
    regex: (pull|pull\-requests|pr|[0-9]+)[/-]
    tracks-release-branches: false
    is-release-branch: false
ignore:
  sha: []
merge-message-formats: {}
assembly-file-versioning-format: '{Major}.{Minor}.{Patch}-{CommitsSinceVersionSource}'
